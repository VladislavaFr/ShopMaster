{% extends 'catalog/base.html' %}

{% block title %}Блог - ShopMaster{% endblock %}

{% block content %}
<h1>Блог</h1>
<a href="{% url 'blog_create' %}" class="btn btn-success mb-3">Создать новую запись</a>
<div class="row">
    {% for post in posts %}
    <div class="col-md-6 mb-4">
        <div class="card">
            {% if post.preview %}
            <img src="{{ post.preview.url }}" class="card-img-top" alt="{{ post.title }}">
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ post.title }}</h5>
                <p class="card-text">{{ post.content|truncatewords:30 }}</p>
                <a href="{% url 'blog_detail' post.pk %}" class="btn btn-primary">Читать далее</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
