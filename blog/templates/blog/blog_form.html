{% extends 'catalog/base.html' %}

{% block title %}Создать/Редактировать запись - ShopMaster{% endblock %}

{% block content %}
<h1>{{ view.object.pk|default:"Создать запись" }}</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
</form>
<a href="{% url 'blog_list' %}" class="btn btn-secondary mt-3">Назад к списку</a>
{% endblock %}
