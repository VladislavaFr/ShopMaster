{% extends 'catalog/base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<h1>{{ product.name }}</h1>
{% if product.image %}
<img src="{{ product.image.url }}" alt="{{ product.name }}" class="img-fluid">
{% endif %}
<p>{{ product.description }}</p>
<p>Цена: {{ product.price }} ₽</p>
<a href="{% url 'home' %}">Вернуться</a>
{% endblock %}
